[workspace]
resolver = "3"
members = [
    "crates/reefshader-core",
    "crates/reefshader-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/matthewlai/ReefShader"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
ffmpeg-next = "9.1"
gyroflow-core = { git = "https://github.com/gyroflow/gyroflow.git", rev = "a298bec3844c0bf070ad001080ec67a411a68791" }
log = "0.4"
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "30.0"
